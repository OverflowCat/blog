name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch's name
  push:
    branches: [src]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# A newer push supersedes an older build for the same ref.
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Identify font cache platform
        id: font-platform
        shell: bash
        run: echo "key=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Cache installed fonts
        id: fonts
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/fonts/blog
            ~/.cache/fontconfig
          # Restore directly into Fontconfig's user font directory. Include the
          # runner image and workflow so image/font changes rebuild the cache.
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.font-platform.outputs.key }}-fonts-v2-${{ hashFiles('.github/workflows/pages.yml') }}
      - name: Update APT metadata
        if: steps.fonts.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository universe -y --no-update
          sudo apt-get update
      - name: Install fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          font_dir="$HOME/.local/share/fonts/blog"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          mkdir -p "$font_dir/ibm-plex" "$font_dir/harmonyos" "$font_dir/apt"

          curl --fail --location --retry 3 --retry-all-errors \
            'https://github.com/IBM/plex/releases/download/%40ibm%2Fplex-sans-sc%401.1.0/ibm-plex-sans-sc.zip' \
            --output "$tmp_dir/ibm-plex-sans-sc.zip"
          # Hinted and unhinted variants have identical basenames. Extract
          # only unhinted TTFs, avoiding collisions and unrelated ZIP contents.
          unzip -q -j "$tmp_dir/ibm-plex-sans-sc.zip" \
            'ibm-plex-sans-sc/fonts/complete/ttf/unhinted/*.ttf' \
            -d "$font_dir/ibm-plex"

          git clone --depth=1 https://gitcode.com/lijuan124/utils_system_resources.git "$tmp_dir/utils_system_resources"
          find "$tmp_dir/utils_system_resources/fonts" \
            -type f -name '*.ttf' -exec cp -t "$font_dir/harmonyos" {} +

          # Only the font files are needed. Extract packages without dpkg's
          # database updates, maintainer scripts, or system-wide cache triggers.
          # fonts-noto-cjk is a dependency of fonts-noto-cjk-extra.
          cd "$tmp_dir"
          apt-get download fonts-noto-cjk fonts-noto-cjk-extra fonts-lmodern
          for archive in ./*.deb; do
            dpkg-deb --extract "$archive" "$tmp_dir/apt"
          done
          # Latin Modern's OTF files live under usr/share/texmf, so search the
          # whole extracted tree rather than just usr/share/fonts.
          find "$tmp_dir/apt" -type f \
            \( -name '*.ttf' -o -name '*.otf' -o -name '*.ttc' \) \
            -exec cp -t "$font_dir/apt" {} +

          fc-cache "$font_dir"
      - name: Verify fonts
        shell: bash
        run: |
          set -euo pipefail
          # Consume all output to avoid SIGPIPE with pipefail and grep -q.
          fonts="$(fc-list --format='%{family}\n')"
          grep -i 'IBM Plex' <<< "$fonts" > /dev/null
          grep -i 'Harmony' <<< "$fonts" > /dev/null
          grep -i 'Noto Sans CJK' <<< "$fonts" > /dev/null
          grep -Ei 'Latin Modern|LM (Roman|Sans|Mono)' <<< "$fonts" > /dev/null
      # Keep setup explicit: withastro/action always reinstalls pnpm internally.
      - name: Read pnpm version
        id: pnpm-version
        shell: bash
        run: echo "version=$(jq -r '.packageManager | sub("^pnpm@"; "")' package.json)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm installation
        id: pnpm-installation
        uses: actions/cache@v4
        with:
          path: ~/setup-pnpm
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-installation-v1-${{ steps.pnpm-version.outputs.version }}
      - name: Setup PNPM
        if: steps.pnpm-installation.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          # Read the version from package.json so there is only one source.
          dest: ~/setup-pnpm
      - name: Activate pnpm
        shell: bash
        run: |
          echo "$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
      - name: Restore Astro cache
        id: astro-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.astro
          key: astro-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            astro-cache-${{ runner.os }}-
      - name: Build site
        run: pnpm run build
      - name: Save Astro cache
        if: steps.astro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.astro
          key: ${{ steps.astro-cache.outputs.cache-primary-key }}
      - name: Archive Pages artifact
        # Preserve hidden files, matching withastro/action (e.g. .well-known).
        run: >-
          tar --dereference --hard-dereference --directory dist
          --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
